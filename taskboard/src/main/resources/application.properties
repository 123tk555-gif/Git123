spring.application.name=taskboard
# このPCからだけ接続できるようにする(ログイン機能がないため、同じネットワークの他の機器に公開しない)
server.address=127.0.0.1
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskboard}
spring.datasource.username=${DB_USERNAME:taskboard}
spring.datasource.password=${DB_PASSWORD:taskboard}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# サーバーのログを taskboard/logs/ に保存する(10MB ごとに切り替え、30日分を残す)
logging.file.name=logs/taskboard.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# ゴミ箱のカードを自動で完全に削除するまでの日数
taskboard.trash.retention-days=30
