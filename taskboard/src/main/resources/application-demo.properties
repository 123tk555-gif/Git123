# 体験版(誰でも試せる公開用)。プロファイル demo で起動したときだけ使う
taskboard.demo.enabled=true
# 毎日 午前4時(日本時間)にテストデータへ戻す(起動時にも戻す)
# 時刻を変えたら、画面の説明文 taskboard.demo.reset-label も合わせる。
# .properties は日本語をそのまま書くと文字化けするため、説明文は AppInfoController の初期値を使っている
# (変えるときは環境変数 TASKBOARD_DEMO_RESETLABEL で渡す)
taskboard.demo.reset-cron=0 0 4 * * *
# いたずら対策: カード(ゴミ箱を含む)は最大100枚まで
taskboard.max-tasks=100
# 小さなサーバー(メモリ 1GB 程度)向けに、データベースへの同時接続を減らす
spring.datasource.hikari.maximum-pool-size=5
